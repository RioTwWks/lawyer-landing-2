name: Build and Deploy to Selectel S3

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy folder to Selectel S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SELECTEL_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SELECTEL_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-7
        run: |
          TARGET_DIR="./dist"
          if [ ! -d "$TARGET_DIR" ]; then
            TARGET_DIR="."
          fi

          aws s3 sync $TARGET_DIR s3://${{ secrets.SELECTEL_BUCKET_NAME }} \
            --endpoint-url=https://s3.ru-7.storage.selcloud.ru \
            --exclude ".git*" \
            --exclude ".github*" \
            --exclude "node_modules*" \
            --no-verify-ssl \
            --delete
